<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--lilas:#EDE5FE;--mist:#F6F2FF;--line:#E4DBFB;--ink:#1E0B4B;--muted:#5B4B7A;
  --brand:#7C3AED;--brand-strong:#4C1D95;--lav:#C4B5FD;--soft:#DDD0FC;--ok:#15803D;--ok-soft:#DCFCE7;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.05}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:3px;border-radius:10px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* topo */
.top{display:flex;align-items:center;gap:18px;padding:12px 28px;border-bottom:1px solid var(--line)}
.lock{display:flex;align-items:center;gap:10px;flex:none}
.lock img{height:40px;width:auto;display:block}
.lock b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:block;line-height:1.1}
.lock small{display:block;font-size:12.5px;color:var(--muted);line-height:1.2}
.steps{display:flex;gap:6px;margin-left:auto;list-style:none;padding:0;margin-block:0}
.steps button{border:0;background:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted)}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--mist);color:var(--muted)}
.steps button[aria-current="step"]{color:var(--ink);background:var(--lilas)}
.steps button[aria-current="step"] .n{background:var(--brand);color:#fff}
.steps button.done .n{background:var(--soft);color:var(--brand-strong)}
.steps button:disabled{cursor:default;opacity:.55}
/* conteúdo */
main{overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen{min-height:100%;padding:40px 28px;display:flex;flex-direction:column;animation:enter .35s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.inner{width:min(1120px,100%);margin-inline:auto;flex:1;display:flex;flex-direction:column}
.title{font-size:clamp(34px,4.6vw,56px);font-weight:700;max-width:20ch}
.sub{font-size:clamp(18px,1.9vw,22px);color:var(--muted);margin-top:12px;max-width:52ch}
/* rodapé */
.foot{display:flex;align-items:center;gap:12px;padding:14px 28px;border-top:1px solid var(--line);background:var(--bg)}
.foot .sp{flex:1}
.btn{border:0;border-radius:999px;min-height:52px;padding:0 24px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--brand);color:#fff;text-decoration:none}
.btn:hover{background:var(--brand-strong)}
.btn:disabled{background:var(--soft);color:#fff;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--brand);color:var(--brand)}
.btn.soft{background:var(--lilas);color:var(--brand-strong)}
.btn.soft:hover{background:var(--soft)}
.btn.sm{min-height:44px;padding:0 18px;font-size:15.5px}

/* início */
.start{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:48px;align-items:start}
.seller{background:var(--mist);border-radius:28px;padding:28px}
.seller .tag{display:inline-block;font-size:14px;font-weight:700;color:var(--brand);background:#fff;border-radius:999px;padding:5px 12px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.field label{font-weight:600;font-size:16px}
.field small{color:var(--muted);font-size:14px}
.field input{min-height:52px;border-radius:14px;border:2px solid var(--line);padding:0 16px;background:#fff;font-size:18px}
.field input:focus{outline:none;border-color:var(--brand)}
.segs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.seg{border:0;text-align:left;border-radius:24px;padding:22px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;gap:12px;min-height:150px;transition:box-shadow .15s,background .15s}
.seg:hover{box-shadow:inset 0 0 0 2px var(--lav)}
.seg[aria-pressed="true"]{background:var(--lilas);box-shadow:inset 0 0 0 3px var(--brand)}
.seg .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--lilas);color:var(--brand)}
.seg[aria-pressed="true"] .ic{background:var(--brand);color:#fff}
.seg b{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.seg span{font-size:15px;color:var(--muted)}

/* abertura */
.hello{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:center;flex:1}
.hello .hi{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.4vw,30px);color:var(--brand);margin-bottom:14px}
.hello h1{font-size:clamp(36px,4.4vw,58px);font-weight:700;max-width:20ch}
.bars{position:relative;height:330px}
.bars span{position:absolute;height:72px;border-radius:999px;left:0}
.bars span:nth-child(1){top:20px;width:100%;background:var(--lilas)}
.bars span:nth-child(2){top:122px;left:14%;width:90%;background:var(--soft)}
.bars span:nth-child(3){top:224px;left:28%;width:38%;background:var(--lav)}
.bars span:nth-child(4){top:224px;left:72%;width:72px;background:var(--brand)}
@media (prefers-reduced-motion:no-preference){.bars span{animation:slide .8s cubic-bezier(.2,.8,.2,1) both}.bars span:nth-child(2){animation-delay:.1s}.bars span:nth-child(3){animation-delay:.2s}.bars span:nth-child(4){animation-delay:.3s}}
@keyframes slide{from{transform:translateX(50%);opacity:0}}
.four{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.four span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--mist);font-weight:600;font-size:16px}
.four span svg{color:var(--brand);width:18px;height:18px}

/* dia a dia */
.sits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:30px}
.sit{border:0;text-align:left;border-radius:22px;padding:20px 22px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:flex;gap:16px;align-items:flex-start;min-height:104px;font-size:19px;font-weight:600;line-height:1.35;transition:background .15s,box-shadow .15s}
.sit:hover{box-shadow:inset 0 0 0 2px var(--lav)}
.sit .box{width:32px;height:32px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 2px var(--lav);display:grid;place-items:center;color:transparent;margin-top:1px;transition:background .15s}
.sit[aria-pressed="true"]{background:var(--lilas);box-shadow:inset 0 0 0 3px var(--brand)}
.sit[aria-pressed="true"] .box{background:var(--brand);color:#fff;box-shadow:none}
.sit .box svg{width:20px;height:20px;stroke-width:3}

/* soluções */
.solwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;flex:1}
.rail{display:flex;flex-direction:column;gap:8px}
.rail h4{margin:6px 4px 2px;font-size:14px;color:var(--muted);font-weight:600}
.pick{border:0;text-align:left;border-radius:18px;padding:12px 14px;background:var(--mist);display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}
.pick .ic{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;flex:none}
.pick small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--brand);color:#fff}
.pick[aria-pressed="true"] small{color:#EDE5FE}
.pick.other{background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.pick.other[aria-pressed="true"]{background:var(--brand);box-shadow:none}
.prod h2{font-size:clamp(40px,4.6vw,60px);font-weight:700}
.prod .lead{font-size:20px;color:var(--muted);margin-top:8px;max-width:56ch}
.said{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.said b{font-size:15px;color:var(--brand);margin-right:4px}
.said span{font-size:15px;background:var(--lilas);border-radius:999px;padding:6px 12px;font-weight:500}
.prodgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:24px;margin-top:22px;align-items:start}
.feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feats li{display:flex;gap:10px;font-size:16.5px;line-height:1.4}
.feats svg{color:var(--brand);width:20px;height:20px;margin-top:2px}
.panel{background:#fff;border-radius:24px;padding:18px;box-shadow:inset 0 0 0 2px var(--line)}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ptop h3{font-size:18px;letter-spacing:-.01em}
.hint{font-size:14px;color:var(--muted)}
.sbtn{border:0;border-radius:999px;min-height:42px;padding:0 16px;font-weight:600;font-size:15px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.sbtn.soft{background:var(--lilas);color:var(--brand-strong)}
.tabs{display:inline-flex;background:var(--mist);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:999px;min-height:38px;padding:0 14px;font-weight:600;font-size:14.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(76,29,149,.15)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(118px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--mist);border-radius:16px;padding:10px;min-height:250px;display:flex;flex-direction:column;gap:8px}
.col h5{margin:0;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;animation:pop .25s ease}
.card b{font-size:14.5px;line-height:1.25}
.card .who{font-size:12.5px;color:var(--muted)}
.card button{border:0;background:var(--lilas);color:var(--brand-strong);border-radius:999px;min-height:34px;font-weight:700;font-size:13.5px}
.card.won{box-shadow:inset 0 0 0 2px var(--ok)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
/* channels */
.chwrap{display:grid;grid-template-columns:170px 1fr;gap:12px}
.chans{display:flex;flex-direction:column;gap:8px}
.chan{border:0;border-radius:14px;min-height:48px;padding:0 12px;background:var(--mist);display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.chan .n{margin-left:auto;font-size:12.5px;background:#fff;border-radius:999px;padding:1px 8px;color:var(--muted)}
.inbox{background:var(--mist);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:280px}
.msg{background:#fff;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;box-shadow:inset 0 0 0 1px var(--line);animation:pop .25s ease}
.msg .ci{grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--lilas);color:var(--brand);display:grid;place-items:center}
.msg .ci svg{width:17px;height:17px}
.msg b{font-size:14.5px}.msg time{font-size:12px;color:var(--muted)}
.msg p{grid-column:2/4;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.new{box-shadow:inset 0 0 0 2px var(--brand)}
/* flow */
.fsteps{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.fstep{flex:1;border-radius:999px;padding:11px 8px;text-align:center;font-weight:700;font-size:14.5px;background:var(--mist);transition:background .3s,color .3s}
.fstep.on{background:var(--brand);color:#fff}
.arrow{color:var(--lav);flex:none;width:18px;height:18px}
.tv{border-radius:18px;padding:14px;box-shadow:inset 0 0 0 5px var(--lilas),0 0 0 1px var(--line)}
.tvh{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;margin-bottom:10px;padding:0 4px}
.tvh span{display:flex;align-items:center;gap:8px}
.live{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.tvc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tvcol{background:var(--mist);border-radius:12px;padding:10px;min-height:170px}
.tvcol h5{margin:0 0 8px;font-size:13px;color:var(--muted)}
.tvi{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:6px;font-size:14px;animation:pop .3s ease}
.tvi b{font-family:var(--display);font-size:17px}
.tvcol.ready .tvi:first-of-type{background:var(--brand);color:#fff;box-shadow:none}
.empty{font-size:13.5px;color:var(--muted)}
/* chat */
.chat{border-radius:16px;padding:12px;min-height:280px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line)}
.bub{max-width:84%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;animation:pop .25s ease}
.bub.c{align-self:flex-end;background:var(--mist);border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:var(--lilas);border-bottom-left-radius:5px}
.bub.a small{display:block;font-size:12px;color:var(--brand);font-weight:700;margin-bottom:2px}
.typing{align-self:flex-start;background:var(--lilas);border-radius:16px;padding:12px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}

/* resumo */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}
.box2{background:var(--mist);border-radius:24px;padding:24px}
.box2 h3{font-size:22px;margin-bottom:14px}
.told{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.told li{display:flex;gap:10px;font-size:17px;line-height:1.4}
.told svg{color:var(--brand);margin-top:3px;width:20px;height:20px}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px}
.rec .ic{width:44px;height:44px;border-radius:50%;background:var(--lilas);color:var(--brand);display:grid;place-items:center;flex:none}
.rec b{font-family:var(--display);font-size:21px;font-weight:700;display:block;line-height:1.1}
.rec span{font-size:14.5px;color:var(--muted)}
.next{margin-top:18px;background:#fff;border-radius:24px;padding:24px;box-shadow:inset 0 0 0 2px var(--lav)}
.next h3{font-size:24px}
.next p{color:var(--muted);margin-top:6px}
.sendrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:flex-end}
.sendrow .field{margin:0;flex:1;min-width:220px}
.contacts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:18px;font-size:15.5px;color:var(--muted)}
.contacts span{display:flex;align-items:center;gap:8px}
.contacts svg{color:var(--brand);width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:9;animation:pop .2s ease}

@media (max-width:900px){
  .top{padding:10px 16px}.lock small{display:none}
  .steps .lbl{display:none}.steps button{padding:6px}
  .screen{padding:26px 16px}.foot{padding:12px 16px}
  .start,.hello,.sum,.prodgrid{grid-template-columns:minmax(0,1fr)}
  .bars{display:none}
  .solwrap{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}.rail h4{display:none}.pick{flex:none}.pick small{display:none}
}
@media (max-width:600px){
  .segs,.sits{grid-template-columns:1fr}
  .chwrap{grid-template-columns:1fr}.chans{flex-direction:row;overflow-x:auto}.chan{flex:none}
  .lock b{font-size:17px}
  .btn{padding:0 18px;font-size:16px}
}

/* modos e preparação */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:28px}
.modes button{border:0;text-align:left;border-radius:20px;padding:16px 20px;background:var(--mist);display:flex;flex-direction:column;gap:2px}
.modes b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.modes span{font-size:15px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--lilas);box-shadow:inset 0 0 0 3px var(--brand)}
.prepbox{margin-top:26px;background:var(--mist);border-radius:24px;padding:24px}
.probs{display:flex;flex-direction:column;gap:10px;margin:16px 0 14px}
.prob{display:grid;grid-template-columns:minmax(0,1fr) 190px 44px;gap:8px;align-items:center}
.prob input,.prob select{min-height:50px;border-radius:14px;border:2px solid var(--line);padding:0 14px;background:#fff;font-size:16px;width:100%}
.prob input:focus,.prob select:focus{outline:none;border-color:var(--brand)}
.del{border:0;width:44px;height:44px;border-radius:12px;background:#fff;color:var(--muted);display:grid;place-items:center}
.del:hover{color:#B91C1C}
.preplist{margin-top:24px}
.prepitem{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prepitem .open{flex:1;border:0;text-align:left;background:#fff;border-radius:16px;padding:12px 16px;display:flex;flex-direction:column}
.prepitem .open:hover{box-shadow:inset 0 0 0 2px var(--lav)}
.prepitem b{font-size:16.5px}.prepitem span{font-size:14px;color:var(--muted)}
.heard{display:flex;flex-direction:column;gap:12px;margin-top:28px;max-width:640px}
.heardi{display:flex;gap:14px;align-items:flex-start;background:var(--mist);border-radius:20px;padding:16px 20px;font-size:clamp(18px,1.8vw,22px);font-weight:600;line-height:1.35}
.heardi svg{color:var(--brand);margin-top:3px}
.tvi span{text-align:right}
.stp{display:block;font-size:12px;color:var(--brand);font-weight:700}

 const prepForm=`<div class="prepbox">
   <h2 style="font-size:24px">O que o cliente contou</h2><p class="hint" style="font-size:15.5px;margin-top:4px">Escreva com as palavras dele. Isso aparece na apresentação.</p>
   <div class="probs">${S.problems.map((p,i)=>`<div class="prob"><input data-pt="${i}" value="${esc(p.t)}" placeholder="Ex.: Os pedidos se perdem entre o balcão e o estoque" aria-label="Problema ${i+1}"><select data-pp="${i}" aria-label="Solução para o problema ${i+1}">${opts(p.p)}</select><button class="del" data-pd="${i}" aria-label="Remover problema ${i+1}">${ic('x')}</button></div>`).join('')}</div>
   ${S.problems.length<6?`<button class="btn soft sm" id="addp">${ic('plus')}Adicionar problema</button>`:''}
   <div class="field"><label for="fsteps">Etapas do Eva Flow para este cliente</label><input id="fsteps" value="${esc(S.flowSteps)}" placeholder="Ex.: Vendas, Separação, Conferência"><small>Opcional. Até 3 etapas separadas por vírgula. O painel da TV entra no final.</small></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn ghost sm" id="savep">${ic('save')}${S.prepId?'Salvar alterações':'Salvar para a reunião'}</button></div>
  </div>`;
 const list=PREPS.length?`<div class="preplist"><h3 style="font-size:18px;margin-bottom:10px">Reuniões preparadas</h3>${PREPS.map(p=>`<div class="prepitem"><button class="open" data-open="${p.id}"><b>${esc(p.biz||'Sem nome')}</b><span>${SEGS[p.seg]?.l||''} – ${p.problems.filter(x=>x.t.trim()).length} problemas</span></button><button class="del" data-rm="${p.id}" aria-label="Excluir preparação de ${esc(p.biz)}">${ic('x')}</button></div>`).join('')}</div>`:'';
 $('#main').innerHTML=`<section class="screen"><div class="inner">
  <div class="modes" role="group" aria-label="Tipo de visita"><button aria-pressed="${!custom()}" data-mode="prospec"><b>Nós procuramos o cliente</b><span>Apresentação pelo segmento</span></button><button aria-pressed="${custom()}" data-mode="demanda"><b>O cliente nos procurou</b><span>Apresentação a partir do que ele contou</span></button></div>
  <div class="start">
   <div class="seller"><span class="tag">Antes de virar a tela</span><h1 class="title" style="font-size:clamp(30px,3.4vw,42px)">Para quem é a apresentação de hoje?</h1>
    <div class="field"><label for="biz">Nome do negócio</label><input id="biz" autocomplete="off" placeholder="Ex.: Padaria Pão Dourado" value="${esc(S.biz)}"><small>${custom()?'Aparece na abertura e no resumo.':'Opcional. Aparece na abertura e no resumo.'}</small></div>
    ${custom()?list:''}</div>
   <div><h2 style="font-size:24px">Qual é o tipo de negócio?</h2>${segBtns}${custom()?prepForm:''}</div>
  </div></div></section>`;
 $('#biz').addEventListener('input',e=>{S.biz=e.target.value;save()});
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.prod=null;S.seen=[];if(custom()&&!S.problems.length)S.problems=[{t:'',p:''}];save();vInicio()});
 document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{if(S.seg!==b.dataset.seg){S.seen=[];S.prod=null}S.seg=b.dataset.seg;save();vInicio();$(`[data-seg="${S.seg}"]`).focus()});
 document.querySelectorAll('[data-pt]').forEach(el=>el.addEventListener('input',()=>{S.problems[+el.dataset.pt].t=el.value;S.prod=null;save();inicioFoot()}));
 document.querySelectorAll('[data-pp]').forEach(el=>el.addEventListener('change',()=>{S.problems[+el.dataset.pp].p=el.value;S.prod=null;save();inicioFoot()}));
 document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{S.problems.splice(+b.dataset.pd,1);if(!S.problems.length)S.problems=[{t:'',p:''}];save();vInicio()});
 $('#addp')?.addEventListener('click',()=>{S.problems.push({t:'',p:''});save();vInicio();document.querySelector(`[data-pt="${S.problems.length-1}"]`)?.focus()});
 $('#fsteps')?.addEventListener('input',e=>{S.flowSteps=e.target.value;save()});
 $('#savep')?.addEventListener('click',()=>{if(!S.biz.trim()){toast('Escreva o nome do negócio para salvar.');$('#biz').focus();return}const data={id:S.prepId||uid(),biz:S.biz,seg:S.seg,problems:S.problems.map(p=>({...p})),flowSteps:S.flowSteps};const i=PREPS.findIndex(p=>p.id===data.id);if(i>=0)PREPS[i]=data;else PREPS.unshift(data);S.prepId=data.id;save();vInicio();toast('Reunião salva neste aparelho.')});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const p=PREPS.find(x=>x.id===b.dataset.open);if(!p)return;S={...blank(),mode:'demanda',biz:p.biz,seg:p.seg,problems:p.problems.map(x=>({...x})),flowSteps:p.flowSteps||'',prepId:p.id};save();vInicio();toast(`${p.biz} carregado.`)});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{PREPS=PREPS.filter(x=>x.id!==b.dataset.rm);if(S.prepId===b.dataset.rm)S.prepId=null;save();vInicio()});
 inicioFoot()}
function inicioFoot(){let msg='';if(custom()&&S.seg){if(!probs().length)msg='Escreva pelo menos um problema.';else if(!probs().every(p=>p.p))msg='Escolha a solução de cada problema.'}
 foot(`<button class="btn ghost sm" id="reset">${ic('redo')}Limpar</button>${msg?`<span class="hint" style="margin-left:6px">${msg}</span>`:''}`,`<button class="btn" ${ready()?'':'disabled'} id="startp">Começar apresentação${ic('right')}</button>`);
 $('#reset').onclick=()=>{const mode=S.mode;S={...blank(),mode};if(mode==='demanda')S.problems=[{t:'',p:''}];save();vInicio()};
 $('#startp').onclick=()=>{S.problems=S.problems.filter(p=>p.t.trim());go('abertura')}}

/* ---------- apresentação ---------- */
function vAbertura(){const name=S.biz.trim();const hi=name?`Olá, ${esc(name)}!`:'Olá!';
 const body=custom()
  ?`<p class="hi">${hi}</p><h1>Preparamos esta conversa a partir do que vocês nos contaram.</h1>
    <div class="heard">${probs().map(p=>`<div class="heardi">${ic('quote')}<span>${esc(p.t.trim())}</span></div>`).join('')}</div>`
  :`<p class="hi">${hi}</p><h1>A Eva Connect organiza o atendimento, as vendas e a operação de negócios como o seu.</h1>
    <p class="sub">São quatro sistemas que funcionam juntos ou separados. Vamos mostrar como cada um funciona no seu negócio.</p>
    <div class="four">${ORDER.map(k=>`<span>${ic(PRODUCTS[k].icon)}${PRODUCTS[k].name}</span>`).join('')}</div>`;
 $('#main').innerHTML=`<section class="screen"><div class="inner"><div class="hello"><div>${body}</div><div class="hsym" aria-hidden="true"></div></div></div></section>`;
 foot(`<button class="btn ghost" onclick="go('inicio')">${ic('left')}Voltar</button>`,`<button class="btn" onclick="go('solucoes')">${custom()?'Ver como resolvemos':'Ver as soluções'}${ic('right')}</button>`)}
function vSolucoes(){const{main,others}=order();const all=[...main,...others];const k=all.includes(S.prod)?S.prod:all[0];S.prod=k;const P=PRODUCTS[k];
 if(!S.seen.includes(k)){S.seen.push(k)}save();
 const heard=custom()?heardFor(k):[];const ex=custom()?[]:examplesFor(k);
 const pick=(x,o)=>`<button class="pick ${o?'other':''}" aria-pressed="${x===k}" data-p="${x}"><span class="ic">${ic(PRODUCTS[x].icon)}</span><span>${PRODUCTS[x].name}<small>${PRODUCTS[x].short}</small></span></button>`;
 const rail=custom()?`<h4>Para o que vocês contaram</h4>${main.map(x=>pick(x)).join('')}${others.length?`<h4>Outras soluções</h4>${others.map(x=>pick(x,1)).join('')}`:''}`:`<h4>Soluções${S.seg?' para '+SEGS[S.seg].l.toLowerCase():''}</h4>${main.map(x=>pick(x)).join('')}`;
 $('#main').innerHTML=`<section class="screen"><div class="inner"><div class="solwrap"><nav class="rail" aria-label="Soluções">${rail}</nav>
  <div class="prod"><h2>${P.name}</h2><p class="lead">${P.lead}</p>
   ${heard.length?`<div class="said"><b>Vocês contaram:</b>${heard.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
   ${ex.length?`<div class="said"><b>Resolve situações como:</b>${ex.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
   <div class="prodgrid"><div class="panel" id="demo"></div><ul class="feats">${P.feats.map(f=>`<li>${ic('circle')}${f}</li>`).join('')}</ul></div>
  </div></div></div></section>`;
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{stopDemos();S.prod=b.dataset.p;save();vSolucoes()});
 DEMOS[k]($('#demo'));
 foot(`<button class="btn ghost" onclick="go('abertura')">${ic('left')}Voltar</button>`,`<button class="btn soft" id="endp">${ic('check')}Finalizar apresentação</button>`);
 $('#endp').onclick=finish}
function finish(){stopDemos();const mode=S.mode;S={...blank(),mode};if(mode==='demanda')S.problems=[{t:'',p:''}];save();render();toast('Apresentação finalizada.')}
/* ---------- demonstrações ---------- */
let timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms));function stopDemos(){timers.forEach(clearTimeout);timers=[]}
const two=n=>String(n).padStart(2,'0');const now=()=>{const d=new Date();return two(d.getHours())+':'+two(d.getMinutes())};
const DEMOS={};
DEMOS.crm=el=>{const COLS=['Novo contato','Em atendimento','Proposta','Cliente'];const NM=['Juliana Costa','Marcos Lima','Fernanda Alves','Rafael Souza','Patrícia Rocha','Carlos Mendes','Beatriz Nunes'];const SEL=['Ana','Bruno','Carla'];
 let cards=[{n:NM[0],s:0,c:0},{n:NM[1],s:1,c:1},{n:NM[2],s:2,c:1},{n:NM[3],s:0,c:2}],ni=4;
 const draw=()=>{el.innerHTML=`<div class="ptop"><h3>Kanban de atendimento</h3><span class="hint">Toque em “Avançar”</span></div><div class="kanban">${COLS.map((t,ci)=>{const cs=cards.map((c,i)=>({...c,i})).filter(c=>c.c===ci);return `<div class="col"><h5>${t}<span>${cs.length}</span></h5>${cs.map(c=>`<div class="card ${ci===3?'won':''}"><b>${c.n}</b><span class="who">Vendedor: ${SEL[c.s]}</span>${ci<3?`<button data-i="${c.i}">Avançar</button>`:''}</div>`).join('')}</div>`}).join('')}</div><div class="ptop" style="margin:12px 0 0"><button class="sbtn" id="add">${ic('plus')}Novo contato</button><span class="hint">${cards.filter(c=>c.c<3).length} em andamento, ${cards.filter(c=>c.c===3).length} fechados</span></div>`;
  el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{cards[+b.dataset.i].c++;draw()});el.querySelector('#add').onclick=()=>{if(cards.filter(c=>c.c===0).length<3){cards.push({n:NM[ni%NM.length],s:ni%3,c:0});ni++;draw()}}};draw()};
DEMOS.channels=el=>{const CH=[['wa','WhatsApp','wa'],['ig','Instagram','insta'],['tg','Telegram','send'],['em','E-mail','mail']];
 const SM={wa:[['Juliana','Oi! Vocês entregam no meu bairro?'],['Marcos','Quero remarcar meu horário de amanhã.'],['Fernanda','Pode me mandar o orçamento de novo?']],ig:[['@ana.lima','Vi o post de vocês, quero saber mais!'],['@carla.r','Qual o horário de funcionamento?']],tg:[['Rafael','Boa tarde, meu pedido já saiu?'],['Patrícia','Vocês têm horário no sábado?']],em:[['Compras – Mercado Bom Preço','Solicitação de cotação'],['Financeiro – Clínica Vida','Segunda via da nota fiscal']]};
 const cnt={wa:1,ig:0,tg:1,em:1},ix={wa:1,ig:0,tg:1,em:1};let box=[{k:'wa',w:SM.wa[0][0],t:SM.wa[0][1],h:'09:41'},{k:'tg',w:SM.tg[0][0],t:SM.tg[0][1],h:'09:30'},{k:'em',w:SM.em[0][0],t:SM.em[0][1],h:'09:12'}];
 const draw=()=>{el.innerHTML=`<div class="ptop"><h3>Caixa de entrada única</h3><span class="hint">Toque em um canal para chegar mensagem</span></div><div class="chwrap"><div class="chans">${CH.map(([k,l,i])=>`<button class="chan" data-k="${k}">${ic(i)}${l}<span class="n">${cnt[k]}</span></button>`).join('')}</div><div class="inbox">${box.slice(0,5).map((m,i)=>{const c=CH.find(x=>x[0]===m.k);return `<div class="msg ${m.nw&&i===0?'new':''}"><span class="ci">${ic(c[2])}</span><b>${esc(m.w)}</b><time>${m.h}</time><p>${c[1]}: ${esc(m.t)}</p></div>`}).join('')}</div></div>`;
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,s=SM[k][ix[k]++%SM[k].length];cnt[k]++;box.unshift({k,w:s[0],t:s[1],h:now(),nw:true});draw()})};draw()};
const FLOWS={lojas:{tab:'Lojas',steps:['Vendas','Estoque'],act:'Registrar venda',tv:'Acompanhe seu pedido',a:'Em andamento',b:'Pronto para retirada',start:5111,code:n=>String(n),names:['Maria Souza','Restaurante Sabor','João Pedro','Construtora Lima','Mercado Bom Preço']},
 lanchonetes:{tab:'Lanchonetes',steps:['Pedido','Em produção'],act:'Registrar pedido',tv:'Seu pedido',a:'Preparando',b:'Pronto para retirar',start:47,code:n=>String(n),names:['Combo duplo','Açaí 500 ml','Pastel e suco','X-salada','Tapioca']},
 clinicas:{tab:'Clínicas',steps:['Senha'],act:'Gerar senha',tv:'Chamada de senhas',a:'Aguardando',b:'Chamando agora',start:12,code:n=>'A'+String(n).padStart(3,'0'),names:['Recepção','Consultório 1','Consultório 2','Coleta','Recepção']}};
DEMOS.flow=el=>{const cs=customSteps();let cfg={...FLOWS};
 if(custom()&&cs.length)cfg={cliente:{tab:S.biz.trim()||'Este cliente',steps:cs,act:'Registrar pedido',tv:'Acompanhe seu pedido',a:'Em andamento',b:'Pronto para retirada',start:1021,code:n=>String(n),names:['Pedido de balcão','Pedido do WhatsApp','Cliente da loja','Pedido por telefone','Retirada agendada']},...FLOWS};
 let fk=cfg.cliente?'cliente':(SEGS[S.seg]?.flow||'lojas'),items,n,active;
 const reset=()=>{const F=cfg[fk];n=F.start;items=[{c:F.code(n-2),w:F.names[3],st:F.steps.length},{c:F.code(n-1),w:F.names[4],st:F.steps.length-1}];active=-1};reset();
 const draw=()=>{const F=cfg[fk],L=F.steps.length;const A=items.filter(x=>x.st<L).slice(-4),B=items.filter(x=>x.st>=L).reverse().slice(0,4);
  const row=(x,showStep)=>`<div class="tvi"><b>${x.c}</b><span>${esc(x.w)}${showStep&&L>1?`<small class="stp">${esc(F.steps[x.st])}</small>`:''}</span></div>`;
  el.innerHTML=`<div class="ptop"><div class="tabs">${Object.entries(cfg).map(([k,f])=>`<button aria-pressed="${k===fk}" data-f="${k}">${esc(f.tab)}</button>`).join('')}</div><a class="sbtn soft" href="${EVA.flowDemo}" target="_blank" rel="noopener">${ic('ext')}Demonstração completa</a></div>
  <div class="fsteps">${[...F.steps,'Painel da TV'].map((s,i)=>(i?`<svg class="i arrow" aria-hidden="true"><use href="#i-right"/></svg>`:'')+`<div class="fstep ${i===active?'on':''}">${esc(s)}</div>`).join('')}</div>
  <div class="tv" aria-live="polite"><div class="tvh"><span><span class="live"></span>${F.tv}</span><span>${now()}</span></div><div class="tvc"><div class="tvcol"><h5>${F.a}</h5>${A.length?A.map(x=>row(x,1)).join(''):'<p class="empty">Nada em andamento.</p>'}</div><div class="tvcol ready"><h5>${F.b}</h5>${B.length?B.map(x=>row(x,0)).join(''):'<p class="empty">Nenhum ainda.</p>'}</div></div></div>
  <div class="ptop" style="margin:12px 0 0"><button class="sbtn" id="act">${ic('plus')}${F.act}</button><span class="hint">Veja o caminho até a TV</span></div>`;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{stopDemos();fk=b.dataset.f;reset();draw()});
  el.querySelector('#act').onclick=()=>{const it={c:F.code(n),w:F.names[n%F.names.length],st:0};n++;items.push(it);active=0;draw();const d=reduce?300:1300;
   for(let j=1;j<=L;j++)later(()=>{it.st=j;active=j;draw()},d*j)}};draw()};
const AI={
 atendimento:{l:'Atendimento',ag:'Agente de atendimento',m:[['c','Boa noite! Vocês ainda estão entregando?'],['a','Boa noite! Estamos sim, até as 23h. Quer que eu te mande o cardápio de hoje?'],['c','Quero. Tem opção sem lactose?'],['a','Tem sim: o açaí tradicional e a tapioca de frango são sem lactose. Posso já anotar o seu pedido?']]},
 recepcao:{l:'Recepção',ag:'Agente de recepção',m:[['c','Oi, queria confirmar minha consulta de amanhã.'],['a','Olá! Encontrei sua consulta amanhã às 14h. Posso confirmar a sua presença?'],['c','Pode sim. E preciso levar algum exame?'],['a','Confirmado! Leve os exames recentes, se tiver, e chegue 10 minutos antes para o cadastro.']]},
 cobranca:{l:'Cobrança',ag:'Agente de cobrança',m:[['c','Oi, recebi um aviso de boleto em aberto.'],['a','Olá! Encontrei uma fatura em aberto no seu cadastro. Quer a segunda via ou prefere combinar uma nova data?'],['c','Prefiro uma nova data.'],['a','Sem problema. Posso registrar o pagamento para daqui a 5 dias, com o novo boleto enviado aqui mesmo. Confirma?']]},
 comercial:{l:'Comercial',ag:'Agente comercial',m:[['c','Queria saber como funciona o serviço de vocês.'],['a','Claro! Para eu indicar a melhor opção: é para uso pessoal ou para a sua empresa?'],['c','Para a empresa, somos 8 pessoas.'],['a','Perfeito. Vou te mostrar as opções para equipes desse tamanho e, se quiser, já agendo uma conversa com um consultor.']]},
 sac:{l:'SAC',ag:'Agente de SAC',m:[['c','Meu pedido ainda não chegou.'],['a','Sinto pelo transtorno. Me passa o número do pedido que eu verifico agora?'],['c','É o 5107.'],['a','Encontrei. Ele saiu para entrega hoje de manhã e deve chegar até o fim da tarde. Quer que eu avise quando for entregue?']]}};
DEMOS.acai=el=>{const first=SEGS[S.seg]?.ai||'comercial';const keys=[first,...['cobranca','comercial','sac'].filter(k=>k!==first)];let ak=first;
 const draw=()=>{el.innerHTML=`<div class="ptop"><div class="tabs">${keys.map(k=>`<button aria-pressed="${k===ak}" data-a="${k}">${AI[k].l}</button>`).join('')}</div><button class="sbtn soft" id="rep">${ic('redo')}Repetir</button></div><div class="chat" id="chat" aria-live="polite"></div><p class="hint" style="margin-top:8px">Exemplo ilustrativo. Cada agente é treinado com as informações da sua empresa.</p>`;
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{stopDemos();ak=b.dataset.a;draw()});el.querySelector('#rep').onclick=()=>{stopDemos();play()};play()};
 const play=()=>{const A=AI[ak],chat=el.querySelector('#chat');chat.innerHTML='';const add=([w,t])=>{chat.querySelector('.typing')?.remove();const d=document.createElement('div');d.className='bub '+w;d.innerHTML=(w==='a'?`<small>${A.ag}</small>`:'')+esc(t);chat.appendChild(d)};
  if(reduce){A.m.forEach(add);return}let t=300;A.m.forEach(m=>{if(m[0]==='a'){later(()=>{const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';chat.appendChild(ty)},t);t+=1100}later(()=>add(m),t);t+=m[0]==='a'?1400:900})};draw()};

if(S.mode==='demanda'&&!S.problems.length)S.problems=[{t:'',p:''}];
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
